<title>女同人格測驗</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout concept: one-screen "app" — start card, a question stage with a
   back/progress rail, and a result stage with a hexagon trait-spectrum
   chart, swapped via [hidden]; flat neutral paper ground, no gendered
   decoration, a single earthy accent instead of a pink/pastel one */
:root{
  --bg:        #f5f3ee;
  --surface:   #ffffff;
  --surface-2: #eae6dd;
  --ink:       #211f1c;
  --ink-soft:  #6b665d;
  --line:      rgba(33,31,28,0.12);
  --accent:    #3c6e63;
  --accent-2:  #a98f4b;
  --accent-soft: rgba(60,110,99,0.12);

  --display: "Noto Serif TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:        #17181a;
    --surface:   #212224;
    --surface-2: #2a2b2d;
    --ink:       #ece9e2;
    --ink-soft:  #a7a39a;
    --line:      rgba(236,233,226,0.12);
    --accent:    #6fb3a3;
    --accent-2:  #d1b872;
    --accent-soft: rgba(111,179,163,0.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        #17181a;
  --surface:   #212224;
  --surface-2: #2a2b2d;
  --ink:       #ece9e2;
  --ink-soft:  #a7a39a;
  --line:      rgba(236,233,226,0.12);
  --accent:    #6fb3a3;
  --accent-2:  #d1b872;
  --accent-soft: rgba(111,179,163,0.16);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.corner-hex{
  position:fixed; top:-60px; right:-60px;
  width:260px; height:260px;
  opacity:0.5; z-index:0; pointer-events:none;
  color:var(--line);
}
@media (prefers-reduced-motion:no-preference){
  .stage{ animation: rise .4s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
}

.wrap{
  position:relative; z-index:1;
  max-width:560px; margin:0 auto;
  padding-top: 36px;
  padding-bottom: 56px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  min-height:100svh;
  display:flex; flex-direction:column;
}

.eyebrow{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--accent);
  margin:0 0 10px;
}

/* ---------- start ---------- */
#start{ margin:auto 0; text-align:center; }
#start h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(36px, 8.6vw, 50px);
  line-height:1.25; margin:0 0 16px;
  text-wrap:balance;
}
#start p.lede{
  font-size:17.5px; line-height:1.8; color:var(--ink-soft);
  margin:0 auto 32px; max-width:46ch;
}
.type-chips{
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  margin-bottom:32px;
}
.type-chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:14.5px; font-weight:600; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:999px; padding:7px 14px 7px 10px;
}
.type-chip svg{ width:15px; height:15px; color:var(--accent); flex:none; }
.btn-primary{
  font-family:var(--body); font-weight:700; font-size:18.5px;
  color:#fff; background:var(--ink);
  border:none; border-radius:16px;
  padding:16px 36px; cursor:pointer;
}
:root[data-theme="dark"] .btn-primary{ color:var(--bg); }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .btn-primary{ color:var(--bg); }
}
.btn-primary:active{ transform:scale(0.98); }
#start .meta{
  margin-top:18px; font-size:14.5px; color:var(--ink-soft);
}

/* ---------- quiz ---------- */
#quiz{ flex:1; display:flex; flex-direction:column; }
.rail{
  display:flex; align-items:center; gap:14px;
  margin-bottom:26px;
}
.back-btn{
  flex:none; width:38px; height:38px; border-radius:11px;
  border:1px solid var(--line); background:var(--surface);
  color:var(--ink-soft); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.back-btn svg{ width:18px; height:18px; }
.back-btn:active{ transform:scale(0.95); }
.rail-track{
  flex:1; height:6px; border-radius:4px;
  background:var(--line); overflow:hidden;
}
.rail-fill{
  height:100%; border-radius:4px;
  background:var(--accent);
  transition:width .35s ease;
}
.rail-count{
  font-variant-numeric:tabular-nums;
  font-size:14.5px; font-weight:700; color:var(--ink-soft);
  white-space:nowrap;
}
.q-title{
  font-family:var(--display); font-weight:700;
  font-size:clamp(24px,6vw,30px); line-height:1.5;
  margin:0 0 24px;
  text-wrap:balance;
}
.options{ display:flex; flex-direction:column; gap:10px; }
.option{
  text-align:left;
  font-family:var(--body); font-size:17px; line-height:1.55; color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line); border-radius:14px;
  padding:16px 18px; cursor:pointer;
  transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.option:hover{ border-color:var(--accent); }
.option:active{ transform:scale(0.99); }
.option.picked{
  border-color:var(--accent);
  background:var(--accent-soft);
}

/* ---------- result ---------- */
.badge-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.badge{
  display:inline-flex; align-items:center; gap:7px;
  font-family:var(--body); font-weight:700; font-size:15px;
}
.badge.primary{
  color:#fff; background:var(--ink);
  border-radius:999px; padding:8px 16px 8px 10px;
}
:root[data-theme="dark"] .badge.primary{ color:var(--bg); }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .badge.primary{ color:var(--bg); }
}
.badge.secondary{
  color:var(--ink-soft); background:transparent;
  border:1px solid var(--line);
  border-radius:999px; padding:7px 15px 7px 9px;
}
.badge svg{ width:15px; height:15px; }
.badge-tp{
  display:inline-flex; align-items:center;
  font-family:var(--body); font-weight:700; font-size:15px;
  color:var(--accent); background:var(--accent-soft);
  border-radius:999px; padding:7px 15px;
}
.hero-icon-circle{
  width:72px; height:72px; border-radius:50%;
  background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  margin-bottom:16px;
}
.hero-icon-circle svg{ width:34px; height:34px; }

.secondary-card{
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:18px; padding:20px 20px 18px; margin-bottom:26px;
}
.secondary-head{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.mini-icon{
  width:46px; height:46px; border-radius:50%; flex:none;
  background:var(--surface); border:1px solid var(--line); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
}
.mini-icon svg{ width:22px; height:22px; }
.secondary-card h3{
  font-family:var(--display); font-weight:700; font-size:20px;
  margin:0 0 2px;
}
.sec-tagline{ font-size:14px; color:var(--accent); font-weight:600; margin:0; }
.secondary-card p#sec-desc{
  font-size:15.5px; line-height:1.8; color:var(--ink-soft); margin:12px 0 0;
}
.trait-meta{ display:flex; flex-direction:column; gap:6px; margin:0 0 22px; }
.trait-row{ display:flex; gap:10px; font-size:15px; line-height:1.55; }
.trait-row .trait-label{
  flex:none; width:48px; color:var(--ink-soft); font-weight:700;
  font-size:13px; letter-spacing:0.04em; padding-top:1px;
}
.trait-row .trait-value{ color:var(--ink); }
.sec-meta{ font-size:14px; color:var(--ink-soft); margin:8px 0 0; line-height:1.65; }

#result h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(32px,8.6vw,46px); line-height:1.25;
  margin:0 0 10px; text-wrap:balance;
}
#result .tagline{
  font-size:17.5px; color:var(--accent); font-weight:700;
  margin:0 0 20px;
}
#result .desc{
  font-size:17px; line-height:1.9; color:var(--ink-soft);
  margin:0 0 8px;
}
#result .desc.flavor{ margin-bottom:30px; }

.spectrum-card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:18px; padding:24px 20px 20px; margin-bottom:28px;
}
.spectrum-card h2{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft);
  margin:0 0 4px;
}
.spectrum-card .hint{
  font-size:14px; color:var(--ink-soft); margin:0 0 10px; opacity:0.85;
}
.radar-figure{ position:relative; width:100%; max-width:320px; aspect-ratio:1; margin:0 auto; }
.radar-figure svg{ position:absolute; inset:0; width:100%; height:100%; }
.radar-vertex{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:4px;
  width:68px; text-align:center;
}
.radar-vertex svg{ width:16px; height:16px; color:var(--accent); flex:none; position:static; }
.radar-vertex .rv-name{ font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.25; }

.attraction-card{
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:18px; padding:22px 22px 20px; margin-bottom:28px;
}
.attraction-card h2{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft);
  margin:0 0 12px;
}
.attraction-card p{
  font-size:16.5px; line-height:1.9; color:var(--ink); margin:0;
}
.chem-badge{
  display:inline-block;
  font-family:var(--body); font-weight:700; font-size:14px;
  color:var(--accent); background:var(--accent-soft);
  border-radius:999px; padding:6px 14px;
  margin-bottom:12px;
}

#share-capture{ background:var(--bg); }

.share-caption{
  text-align:center; font-size:13.5px; color:var(--ink-soft);
  margin-top:8px; letter-spacing:0.02em;
}
.support-card{
  margin-top:28px; padding-top:22px; border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.support-card p{ font-size:15px; color:var(--ink-soft); margin:0; }
.result-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.share-invite{
  margin-top:24px; padding-top:22px; border-top:1px solid var(--line);
  display:flex; flex-direction:column; align-items:flex-start; gap:12px;
}
.share-invite p{ font-size:16px; font-weight:600; color:var(--ink); margin:0; }
.btn-ghost{
  font-family:var(--body); font-weight:700; font-size:16px;
  color:var(--ink); background:transparent;
  border:1.5px solid var(--line); border-radius:14px;
  padding:13px 22px; cursor:pointer;
}
.btn-ghost:active{ transform:scale(0.98); }
.copied{ font-size:14.5px; color:var(--ink-soft); margin-top:10px; height:16px; }

footer{
  text-align:center; font-size:14px; color:var(--ink-soft);
  margin-top:40px;
}
</style>

<svg class="corner-hex" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <polygon points="100,10 182,55 182,145 100,190 18,145 18,55" stroke="currentColor" stroke-width="1.5"/>
</svg>

<div class="wrap">

  <section id="start" class="stage">
    <div class="eyebrow">女同人格 × 心動測驗 · 自適應</div>
    <h1>你是哪一種<br>戀愛人設？</h1>
    <p class="lede">測測你在女同圈是哪一種類型，也測測你容易被哪一種類型吸引，最後看看兩個結果合在一起的化學反應。</p>
    <div class="type-chips" id="type-chips"></div>
    <button class="btn-primary" id="start-btn">開始測驗</button>
    <div class="meta">大約 4-5 分鐘 · 分兩階段進行 · 題目依答案即時調整 · 可返回修改答案</div>
  </section>

  <section id="quiz" class="stage" hidden>
    <div class="rail">
      <button class="back-btn" id="back-btn" type="button" aria-label="上一題">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="rail-track"><div class="rail-fill" id="rail-fill"></div></div>
      <div class="rail-count" id="rail-count">1 / 20</div>
    </div>
    <h2 class="q-title" id="q-title"></h2>
    <div class="options" id="q-options"></div>
  </section>

  <section id="result" class="stage" hidden>
    <div id="share-capture">
      <div class="eyebrow">測驗結果</div>
      <div class="badge-row" id="r-badges"></div>
      <div class="hero-icon" id="hero-icon"></div>
      <h1 id="r-name"></h1>
      <p class="tagline" id="r-tagline"></p>
      <div class="trait-meta" id="r-traits"></div>
      <p class="desc" id="r-desc"></p>
      <p class="desc flavor" id="r-flavor"></p>

      <div class="secondary-card" id="secondary-card" hidden>
        <h2 style="font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px;">副型介紹</h2>
        <div class="secondary-head">
          <span class="mini-icon" id="sec-icon"></span>
          <div>
            <h3 id="sec-name"></h3>
            <p class="sec-tagline" id="sec-tagline"></p>
          </div>
        </div>
        <p id="sec-desc"></p>
        <p class="sec-meta" id="sec-meta"></p>
      </div>

      <div class="spectrum-card">
        <h2>T / P 傾向</h2>
        <p class="hint">純粹呈現這次回答的比例，不是定論，怎麼定義自己由妳決定</p>
        <div id="tp-bar-wrap" style="margin-top:20px;"></div>
      </div>

      <div class="share-caption">第一階段結果</div>
    </div>

    <div class="result-actions">
      <button class="btn-primary" id="to-stage2-btn">繼續測心動類型</button>
    </div>
  </section>

  <section id="quiz2" class="stage" hidden>
    <div class="rail">
      <button class="back-btn" id="back-btn-2" type="button" aria-label="上一題">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="rail-track"><div class="rail-fill" id="rail-fill-2"></div></div>
      <div class="rail-count" id="rail-count-2">1 / 10</div>
    </div>
    <h2 class="q-title" id="q-title-2"></h2>
    <div class="options" id="q-options-2"></div>
  </section>

  <section id="final" class="stage" hidden>
    <div class="eyebrow">測驗結果</div>

    <div class="secondary-card" id="final-personality-card" style="margin-bottom:22px;"></div>
    <div class="secondary-card" id="final-attraction-card" style="margin-bottom:22px;"></div>

    <div class="attraction-card">
      <h2>化學反應</h2>
      <span class="chem-badge" id="chem-badge"></span>
      <p id="chem-text"></p>
    </div>

    <div class="result-actions">
      <button class="btn-primary" id="retake-btn">重新測驗</button>
    </div>

    <div class="share-invite">
      <p>歡迎留言分享你的測驗結果，也歡迎在這裡認識新朋友、找你的另一半！</p>
      <button class="btn-ghost" id="copy-url-btn">複製網址</button>
    </div>
    <div class="copied" id="url-msg"></div>

    <div class="support-card" id="support-card" hidden>
      <p>如果喜歡這個測驗，想請我喝杯飲料也可以</p>
      <a class="btn-ghost" id="support-link" href="#" target="_blank" rel="noopener">請我喝珍奶</a>
    </div>
  </section>

  <footer>用你平常的直覺作答，結果純屬娛樂，認真你就輸了。</footer>
</div>

<script>
(function(){

var ICONS = {
  sun:   '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  iron:  '<path d="M20 14.6A8.4 8.4 0 1 1 9.4 4a7 7 0 0 0 10.6 10.6z"/>',
  pup:   '<circle cx="12" cy="15.3" r="3.1"/><circle cx="6.6" cy="9.2" r="1.5"/><circle cx="10.2" cy="6.2" r="1.5"/><circle cx="13.8" cy="6.2" r="1.5"/><circle cx="17.4" cy="9.2" r="1.5"/>',
  swan:  '<path d="M19 5c-5 0-13.5 2-13.5 13.5"/><path d="M19 5c0 5-2.5 13.5-13.5 13.5"/><path d="M4.2 19.8l3-3"/>',
  bunny: '<path d="M9.3 11c-1.6-3-2.1-6.6-.6-8.1S12 3 12 7.2"/><path d="M14.7 11c1.6-3 2.1-6.6.6-8.1S12 3 12 7.2"/><circle cx="12" cy="14.8" r="5"/><circle cx="10" cy="14.3" r="0.65" fill="currentColor"/><circle cx="14" cy="14.3" r="0.65" fill="currentColor"/>',
  free:  '<path d="M8 15a3 3 0 1 1 0-6c2 0 3 1.6 4 3s2 3 4 3a3 3 0 1 0 0-6c-2 0-3 1.6-4 3s-2 3-4 3z"/>',
  boss:  '<path d="M5 18h14"/><path d="M6 18l-1-8 4.3 3.2L12 7l2.7 6.2L19 10l-1 8"/>',
  frost: '<path d="M12 2.5v19M4 7l16 10M4 17L20 7"/>'
};
function iconSvg(type, size){
  size = size || 16;
  return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICONS[type]+'</svg>';
}

var ORDER = ["sun","iron","pup","swan","bunny","free","boss","frost"];

/* ---------- adaptive engine: nine trait dimensions ---------- */
var DIMS = ["dom","care","surr","plat","attach","tension","bound","possess","vis"];
var DIM_LABELS = {
  dom:"主導感", care:"照顧傾向", surr:"交出控制", plat:"精神戀愛",
  attach:"依戀模式", tension:"撩撥張力", bound:"邊界感", possess:"佔有慾", vis:"社交顯性度"
};
/* each type's baseline across the nine dimensions, 0-10 scale, 5 = neutral */
var PROTO = {
  sun:   [9,8,2,3,3,5,6,5,7],
  iron:  [6,6,2,4,2,3,8,4,2],
  pup:   [5,6,4,3,7,8,3,6,8],
  swan:  [6,5,4,7,4,4,7,4,5],
  bunny: [2,4,8,5,9,6,2,7,4],
  free:  [5,5,5,5,5,5,5,3,6],
  boss:  [10,5,1,3,4,8,2,9,8],
  frost: [4,3,3,8,2,2,9,2,2]
};
var CENTERED = {};
ORDER.forEach(function(t){ CENTERED[t] = PROTO[t].map(function(v){ return v-5; }); });
function dot(a,b){ var s=0; for (var i=0;i<a.length;i++) s += a[i]*b[i]; return s; }
function rankTypes(dims){
  return ORDER.slice().sort(function(a,b){ return dot(dims,CENTERED[b]) - dot(dims,CENTERED[a]); });
}
var TOTAL_Q = 12;

var BANK = [
  { id:"q1", focus:["dom","surr"], opener:true, q: "不管是旅行行程、晚餐吃什麼，還是家裡的大小事，只要遇到需要做決定的時刻，你通常會：", opts: [
    ["很快做出決定，然後說服大家一起走","sun"],
    ["自己先想清楚，才把決定說出來","iron"],
    ["想先問問大家的意見，一起討論","pup"],

function chemistryText(pType, aType){
  var p = RESULTS[pType], a = RESULTS[aType];
  if (pType === aType){
    return "妳是『" + p.name + "」，而讓妳心動的也是『" + a.name + "』這一型——妳們很容易一拍即合，像照鏡子一樣懂對方在想什麼，相處起來特別不費力。只是太像的兩個人，偶爾也要提醒自己留一點空間給彼此，別把對方的習慣都當成理所當然。";
  }
  var pDom = PROTO[pType][0], aDom = PROTO[aType][0];
  if (Math.abs(pDom - aDom) >= 3){
    return "妳是『" + p.name + "』，容易被『" + a.name + "』吸引——一個習慣往前帶、一個習慣順著走，妳們剛好能補上彼此的節奏。這種一主動一安靜的組合，相處起來意外地平衡，只要記得偶爾交換一下角色，感情會更有彈性。";
  }
  return "妳是『" + p.name + "』，容易被『" + a.name + "』吸引——" + p.tagline + "的妳，遇上" + a.tagline + "的對方，兩人調性雖然不完全一樣，卻能在彼此身上看見自己沒有的那一面。這種若即若離的吸引力，常常是感情裡最耐人尋味的部分。";
}

/* a light, qualitative companion tag for the chemistry text — not a
   precision "compatibility score" (the underlying read only has three
   broad shapes), just a short label so the result has a little visual
   anchor without pretending to more precision than the model has. */
function chemistryLabel(pType, aType){
  if (pType === aType) return "同頻共振";
  var pDom = PROTO[pType][0], aDom = PROTO[aType][0];
  if (Math.abs(pDom - aDom) >= 3) return "互補吸引";
  return "若即若離";
}

/* state.asked: question objects shown so far, in order.
   state.picks: chosen type per asked question (same length as answered-so-far).
   state.deltas: the nine-dimension delta each answer contributed (same length as picks).
   state.pos: index of the question currently on screen. */
var state = { asked: [], picks: [], deltas: [], pos: 0, phase: 'personality' };

/* an option's effect on the nine dimensions isn't just "which type it points
   to" — it's weighted by what the question is actually probing (q.focus).
   Full weight on the question's own focus dimensions, a light touch
   elsewhere, so different questions carry genuinely different information
   and the adaptive picker below has something real to discriminate on. */
function optionDelta(type, focus){
  return DIMS.map(function(d, i){
    return focus.indexOf(d) >= 0 ? CENTERED[type][i] : CENTERED[type][i] * 0.25;
  });
}

function sumDeltas(deltas){
  var dims = DIMS.map(function(){ return 0; });
  deltas.forEach(function(delta){
    delta.forEach(function(v, i){ dims[i] += v; });
  });
  return dims;
}

function pickOpener(remaining){
  var openers = remaining.filter(function(q){ return q.opener; });
  var pool = openers.length ? openers : remaining;
  return pool[Math.floor(Math.random() * pool.length)];
}

/* choose the next question: for the first couple of picks, start broad with
   a random opener so repeat plays feel different; after that, pick whichever
   unused question best separates the two currently-leading types, so the
   question path adapts to how the answers are trending. */
function pickNextQuestion(){
  var askedIds = state.asked.map(function(q){ return q.id; });
  var remaining = BANK.filter(function(q){ return askedIds.indexOf(q.id) < 0; });
  if (!remaining.length) return null;
  if (state.picks.length < 2){
    return pickOpener(remaining);
  }
  var dims = sumDeltas(state.deltas);
  var ranked = rankTypes(dims);
  var diff = CENTERED[ranked[0]].map(function(v, i){ return v - CENTERED[ranked[1]][i]; });
  var best = null, bestSpread = -Infinity;
  remaining.forEach(function(q){
    var dots = q.opts.map(function(o){ return dot(optionDelta(o[1], q.focus), diff); });
    var spread = Math.max.apply(null, dots) - Math.min.apply(null, dots);
    if (spread > bestSpread){ bestSpread = spread; best = q; }
  });
  return best || remaining[0];
}

function renderQuestion(){
  if (state.phase === 'tph'){
    renderTPStep();
    return;
  }
  var q = state.asked[state.pos];
  document.getElementById('rail-count').textContent = (state.pos+1) + ' / ' + TOTAL_STAGE1;
  document.getElementById('rail-fill').style.width = (state.pos/TOTAL_STAGE1*100) + '%';
  document.getElementById('q-title').textContent = q.q;
  var optsEl = document.getElementById('q-options');
  optsEl.innerHTML = '';
  var prevAnswer = state.picks[state.pos];
  q.opts.forEach(function(opt){
    var btn = document.createElement('button');
    btn.className = 'option' + (prevAnswer === opt[1] ? ' picked' : '');
    btn.type = 'button';
    btn.textContent = opt[0];
    btn.addEventListener('click', function(){ pick(opt[1], btn); });
    optsEl.appendChild(btn);
  });
  quizEl.classList.remove('stage');
  void quizEl.offsetWidth;
  quizEl.classList.add('stage');
}

function pick(type, btn){
  var all = document.querySelectorAll('#q-options .option');
  all.forEach(function(b){ b.disabled = true; b.classList.remove('picked'); });
  btn.classList.add('picked');

  /* record this answer at the current position; if we're revisiting an
     earlier question (via back-btn) and the answer changed, drop whatever
     was adaptively chosen after it, since that path is no longer valid */
  var q = state.asked[state.pos];
  state.picks[state.pos] = type;
  state.deltas[state.pos] = optionDelta(type, q.focus);
  state.picks.length = state.pos + 1;
  state.deltas.length = state.pos + 1;
  state.asked.length = state.pos + 1;

  setTimeout(function(){
    if (state.picks.length >= TOTAL_Q){
      /* personality phase done — the quiz continues straight into the 8
         T / P questions before showing any result, so the two reads
         (type + spectrum) land on the same result screen together */
      state.phase = 'tph';
      tpState = { i: 0, answers: [] };
      renderQuestion();
      return;
    }
    var next = pickNextQuestion();
    state.asked.push(next);
    state.pos += 1;
    renderQuestion();
  }, 220);
}

/* ---------- T / P step: 8 fixed questions, answered right after the 12
   adaptive personality questions and before any result is shown. Scored
   on a plain -2..+2 scale and reported only as a percentage spectrum on
   the result screen — never as a declarative "you are T" label. ---------- */
function renderTPStep(){
  var q = TP_BANK[tpState.i];
  var overall = TOTAL_Q + tpState.i;
  document.getElementById('rail-count').textContent = (overall+1) + ' / ' + TOTAL_STAGE1;
  document.getElementById('rail-fill').style.width = (overall/TOTAL_STAGE1*100) + '%';
  document.getElementById('q-title').textContent = q.q;
  var optsEl = document.getElementById('q-options');
  optsEl.innerHTML = '';
  var prev = tpState.answers[tpState.i];
  q.opts.forEach(function(opt){
    var btn = document.createElement('button');
    btn.className = 'option' + (prev === opt[1] ? ' picked' : '');
    btn.type = 'button';
    btn.textContent = opt[0];
    btn.addEventListener('click', function(){ pickTP(opt[1], btn); });
    optsEl.appendChild(btn);
  });
  quizEl.classList.remove('stage');
  void quizEl.offsetWidth;
  quizEl.classList.add('stage');
}

function pickTP(value, btn){
  var all = document.querySelectorAll('#q-options .option');
  all.forEach(function(b){ b.disabled = true; b.classList.remove('picked'); });
  btn.classList.add('picked');
  tpState.answers[tpState.i] = value;
  setTimeout(function(){
    if (tpState.i + 1 >= TP_BANK.length){
      showResult();
      return;
    }
    tpState.i += 1;
    renderQuestion();
  }, 220);
}

/* the middle band of the spectrum (40%-60%) is where neither pole stands
   out — that's the "不分" zone. It's not a separate category computed on
   its own axis, just the center of the same T/P line, so it's surfaced
   as a plain description rather than a declared label. */
var MID_ZONE_LOW = 40, MID_ZONE_HIGH = 60;

function tpSplit(){
  var raw = tpState.answers.reduce(function(a,b){ return a+b; }, 0);
  var tPct = Math.round(((raw + 16) / 32) * 100);
  tPct = Math.max(0, Math.min(100, tPct));
  return { tPct: tPct, pPct: 100 - tPct };
}

/* a short "leaning" word for the primary-type badge row — still phrased as
   a lean ("偏"), not a flat label like the badge would be if it just said
   "T" or "P", so it stays consistent with "this isn't a conclusion". */
function tpLeanLabel(){
  var s = tpSplit();
  if (s.tPct >= MID_ZONE_LOW && s.tPct <= MID_ZONE_HIGH) return '偏不分';
  return s.tPct > s.pPct ? '偏 T' : '偏 P';
}

function renderTPBar(){
  var s = tpSplit();
  var tPct = s.tPct, pPct = s.pPct;
  var inMidZone = tPct >= MID_ZONE_LOW && tPct <= MID_ZONE_HIGH;
  var midNote = inMidZone
    ? '<p style="font-size:14px;color:var(--ink-soft);margin:14px 0 0;line-height:1.65;">這次的回答落在光譜中間（40%–60% 之間），比較靠近「不分」的位置，一樣不是定論，純粹描述這次的作答落點。</p>'
    : '';
  document.getElementById('tp-bar-wrap').innerHTML =
    '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin-bottom:10px;">' +
      '<span>P ' + pPct + '%</span><span>T ' + tPct + '%</span>' +
    '</div>' +
    '<div style="position:relative;height:16px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex;">' +
      '<div style="width:' + pPct + '%;background:var(--accent-2);"></div>' +
      '<div style="width:' + tPct + '%;background:var(--accent);"></div>' +
    '</div>' +
    midNote;
}

function showResult(){
  quizEl.hidden = true;
  resultEl.hidden = false;
  resultEl.classList.remove('stage');
  void resultEl.offsetWidth;
  resultEl.classList.add('stage');

  var dims = sumDeltas(state.deltas);
  var ranked = rankTypes(dims);
  var primary = ranked[0];
  var secondary = ranked[1];
  var r = RESULTS[primary];
  var hasSecondary = dot(dims, CENTERED[secondary]) > 0;

  var badgesEl = document.getElementById('r-badges');
  badgesEl.innerHTML =
    '<span class="badge primary">' + iconSvg(primary,15) + '<span>主型・' + r.name + '</span></span>' +
    (hasSecondary
      ? '<span class="badge secondary">' + iconSvg(secondary,15) + '<span>副型・' + RESULTS[secondary].name + '</span></span>'
      : '') +
    '<span class="badge-tp">' + tpLeanLabel() + '</span>';

  document.getElementById('hero-icon').innerHTML = '<span class="hero-icon-circle">' + iconSvg(primary,34) + '</span>';
  document.getElementById('r-name').textContent = r.name;
  document.getElementById('r-tagline').textContent = r.tagline;
  document.getElementById('r-traits').innerHTML =
    '<div class="trait-row"><span class="trait-label">性格</span><span class="trait-value">' + r.traits + '</span></div>' +
    '<div class="trait-row"><span class="trait-label">風格</span><span class="trait-value">' + r.style + '</span></div>';
  document.getElementById('r-desc').textContent = r.desc;
  document.getElementById('r-flavor').textContent = hasSecondary ? FLAVOR[secondary] : PURE_LINE;
  stage1Result = { primary: primary, secondary: secondary, hasSecondary: hasSecondary };

  renderTPBar();

function renderQ2(){
  var q = BANK2[state2.i];
  document.getElementById('rail-count-2').textContent = (state2.i+1) + ' / ' + BANK2.length;
  document.getElementById('rail-fill-2').style.width = (state2.i/BANK2.length*100) + '%';
  document.getElementById('q-title-2').textContent = q.q;
  var optsEl = document.getElementById('q-options-2');
  optsEl.innerHTML = '';
  var prev = state2.picks[state2.i];
  q.opts.forEach(function(opt){
    var btn = document.createElement('button');
    btn.className = 'option' + (prev === opt[1] ? ' picked' : '');
    btn.type = 'button';
    btn.textContent = opt[0];
    btn.addEventListener('click', function(){ pick2(opt[1], btn); });
    optsEl.appendChild(btn);
  });
  quiz2El.classList.remove('stage');
  void quiz2El.offsetWidth;
  quiz2El.classList.add('stage');
}

function pick2(type, btn){
  var all = document.querySelectorAll('#q-options-2 .option');
  all.forEach(function(b){ b.disabled = true; b.classList.remove('picked'); });
  btn.classList.add('picked');
  state2.picks[state2.i] = type;
  setTimeout(function(){
    if (state2.i + 1 >= BANK2.length){
      finishStage2();
      return;
    }
    state2.i += 1;
    renderQ2();
  }, 220);
}

function finishStage2(){
  var counts = {};
  ORDER.forEach(function(t){ counts[t] = 0; });
  state2.picks.forEach(function(t){ counts[t] += 1; });
  var aType = ORDER.slice().sort(function(a,b){ return counts[b]-counts[a]; })[0];

  quiz2El.hidden = true;
  finalEl.hidden = false;
  finalEl.classList.remove('stage');
  void finalEl.offsetWidth;
  finalEl.classList.add('stage');

  var p = RESULTS[stage1Result.primary];
  var a = RESULTS[aType];

  document.getElementById('final-personality-card').innerHTML =
    '<h2 style="font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px;">妳的人格類型</h2>' +
    '<div class="secondary-head">' +
      '<span class="mini-icon">' + iconSvg(stage1Result.primary,22) + '</span>' +
      '<div><h3>' + p.name + '</h3><p class="sec-tagline">' + p.tagline + '</p></div>' +
    '</div>' +
    '<p style="font-size:15.5px;line-height:1.8;color:var(--ink-soft);margin:12px 0 0;">' + p.desc + '</p>';

  document.getElementById('final-attraction-card').innerHTML =
    '<h2 style="font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px;">妳容易被吸引的類型</h2>' +
    '<div class="secondary-head">' +
      '<span class="mini-icon">' + iconSvg(aType,22) + '</span>' +
      '<div><h3>' + a.name + '</h3><p class="sec-tagline">' + a.tagline + '</p></div>' +
    '</div>' +
    '<p style="font-size:15.5px;line-height:1.8;color:var(--ink-soft);margin:12px 0 0;">' + a.desc.replace(/你/g, '她') + '</p>';

  document.getElementById('chem-badge').textContent = chemistryLabel(stage1Result.primary, aType);
  document.getElementById('chem-text').textContent = chemistryText(stage1Result.primary, aType);

  document.getElementById('copy-url-btn').onclick = function(){
    var url = location.href;
    var msg = document.getElementById('url-msg');
    function done(ok){ msg.textContent = ok ? '已複製網址，傳給朋友讓他們也測測看' : '複製失敗，請手動複製網址列'; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ done(true); }).catch(function(){ done(false); });
    } else {
      done(false);
    }
  };
}
